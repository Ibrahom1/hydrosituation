name: Remote Data Collector (6h)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours UTC
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run collector (resilient)
        env:
          FFD_API_KEY: ${{ secrets.FFD_API_KEY }}
        run: |
          python remote_collector.py || echo "Collector script signaled non-zero; continuing (graceful)."
      - name: Commit latest.json
        run: |
          if [ -f latest.json ]; then
            git config user.name 'github-actions'
            git config user.email 'actions@github.com'
            git add latest.json
            git commit -m "chore: update latest dataset $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo 'No changes'
            git push
          fi
