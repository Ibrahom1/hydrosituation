name: Remote Data Collector (Daily) - JSON + Database

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC (08:00 Karachi)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
              
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
                
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Show runner egress IP
        run: |
          echo "Detecting public egress IP for this workflow run..."
          RUNNER_IP=$(curl -fsS --max-time 20 https://api.ipify.org || true)
          if [ -n "$RUNNER_IP" ]; then
            echo "Runner public IP: $RUNNER_IP"
          else
            echo "Could not detect runner public IP from ipify."
          fi
                
      - name: Validate API key secret
        env:
          FFD_API_KEY: ${{ secrets.FFD_API_KEY }}
        run: |
          if [ -n "$FFD_API_KEY" ]; then
            echo "FFD_API_KEY secret detected (len=${#FFD_API_KEY})";
          else
            echo "No FFD_API_KEY secret configured; collector will likely skip.";
          fi
                
      - name: Restore database from previous run
        run: |
          if [ -f hydro_history.db ]; then
            echo "Database exists ($(stat -c%s hydro_history.db) bytes)"
          else
            echo "No existing database - will create new one"
          fi
                
      - name: Run enhanced collector (JSON + Database)
        env:
          FFD_API_KEY: ${{ secrets.FFD_API_KEY }}
          MAX_ATTEMPTS: '1'
        run: |
          echo "Starting data collection with database support..."
          python remote_collector.py || echo "Collector script signaled non-zero; continuing (graceful)."
                
      - name: Check collection results
        run: |
          echo "=== Collection Results ==="
          if [ -f latest.json ]; then
            echo "✅ latest.json created/updated"
            echo "   Size: $(stat -c%s latest.json) bytes"
            echo "   Content preview:"
            head -n 10 latest.json
          else
            echo "❌ latest.json not found"
          fi
                    
          if [ -f hydro_history.db ]; then
            echo "✅ Database exists"
            echo "   Size: $(stat -c%s hydro_history.db) bytes"
            # Count records in database using SQLite
            echo "   Record count: $(sqlite3 hydro_history.db 'SELECT COUNT(*) FROM telemetry_history;' 2>/dev/null || echo 'Cannot query')"
          else
            echo "❌ Database not found"
          fi
                
      - name: Commit both JSON and Database
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
                    
          # Add files that exist
          if [ -f latest.json ]; then
            git add latest.json
            echo "Added latest.json to commit"
          fi
                    
          if [ -f hydro_history.db ]; then
            # Force add the database file even if it's in .gitignore
            git add -f hydro_history.db
            echo "Added hydro_history.db to commit (forced)"
          fi
                    
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update dataset & database $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo "Successfully committed and pushed updates"
          fi