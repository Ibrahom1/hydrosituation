name: Remote Data Collector (Daily) - JSON + Database

on:
  schedule:
    - cron: '0 */3 * * *'  # every 3 hours (UTC)
  workflow_dispatch: {}

jobs:
  collect:
    runs-on:
      - self-hosted
      - linux
      - x64
      - ffd-linux
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Show runner egress IP
        run: |
          echo "Detecting public egress IP for this workflow run..."
          RUNNER_IP=$(curl -fsS --max-time 20 https://api.ipify.org || true)
          if [ -n "$RUNNER_IP" ]; then
            echo "Runner public IP: $RUNNER_IP"
          else
            echo "Could not detect runner public IP from ipify."
          fi

      - name: Validate API key secret
        env:
          FFD_API_KEY: ${{ secrets.FFD_API_KEY }}
        run: |
          if [ -n "$FFD_API_KEY" ]; then
            echo "FFD_API_KEY secret detected (len=${#FFD_API_KEY})"
          else
            echo "No FFD_API_KEY secret configured. API collection will be unavailable and HTML fallback will run in this workflow."
          fi

      - name: Restore database from previous run
        run: |
          if [ -f hydro_history.db ]; then
            echo "Database exists ($(stat -c%s hydro_history.db) bytes)"
          else
            echo "No existing database - will create new one"
          fi

      - name: Run primary API collector (JSON + Database)
        id: primary_collector
        continue-on-error: true
        env:
          FFD_API_KEY: ${{ secrets.FFD_API_KEY }}
          MAX_ATTEMPTS: '1'
        run: |
          echo "Starting data collection with database support..."
          python remote_collector.py

      - name: Fetch fresh FFD river-state HTML when API is unavailable
        if: steps.primary_collector.outcome == 'failure'
        run: |
          echo "Primary API collector could not fetch data. Fetching fresh public FFD river-state HTML..."
          python ffd_html_fallback_collector.py --fetch-html river-state.html

      - name: Upload raw FFD HTML artifact
        if: steps.primary_collector.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ffd-river-state-html
          path: river-state.html
          if-no-files-found: error
          retention-days: 14

      - name: Run HTML fallback collector (JSON + Database)
        if: steps.primary_collector.outcome == 'failure'
        run: |
          python ffd_html_fallback_collector.py --html-file river-state.html --min-stations 1

      - name: Check collection results
        run: |
          echo "=== Collection Results ==="
          if [ -f latest.json ]; then
            echo "latest.json created/updated"
            echo "   Size: $(stat -c%s latest.json) bytes"
            echo "   Content preview:"
            head -n 10 latest.json
          else
            echo "latest.json not found"
            exit 1
          fi

          if [ -f hydro_history.db ]; then
            echo "Database exists"
            echo "   Size: $(stat -c%s hydro_history.db) bytes"
            RECORD_COUNT=$(python -c "import sqlite3; conn=sqlite3.connect('hydro_history.db'); print(conn.execute('SELECT COUNT(*) FROM telemetry_history;').fetchone()[0]); conn.close()")
            echo "   Record count: $RECORD_COUNT"
          else
            echo "Database not found"
            exit 1
          fi

      - name: Commit both JSON and Database
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'

          if [ -f latest.json ]; then
            git add latest.json
            echo "Added latest.json to commit"
          fi

          if [ -f hydro_history.db ]; then
            git add -f hydro_history.db
            echo "Added hydro_history.db to commit (forced)"
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update dataset & database $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
            echo "Successfully committed and pushed updates"
          fi
