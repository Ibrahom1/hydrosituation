name: Remote Data Collector (6h)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours UTC
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Derive API key if secret missing
        run: |
          echo "Deriving FFD_API_KEY (secret not referenced in this workflow).";
          if [ -f backend/app.py ]; then
            KEY=$(grep -E 'FFD_TOKEN\s*=\s*"' backend/app.py | head -1 | sed -E 's/.*"([^"]+)".*/\1/');
            if [ -n "$KEY" ]; then
              echo "Extracted token (length ${#KEY}).";
              echo "FFD_API_KEY=$KEY" >> $GITHUB_ENV
            else
              echo "Failed to extract token from backend/app.py";
            fi
          else
            echo "backend/app.py not found";
          fi
      - name: Run collector (resilient)
        env:
          FFD_API_KEY: ${{ env.FFD_API_KEY }}
        run: |
          python remote_collector.py || echo "Collector script signaled non-zero; continuing (graceful)."
      - name: Commit latest.json
        run: |
          if [ -f latest.json ]; then
            git config user.name 'github-actions'
            git config user.email 'actions@github.com'
            git add latest.json
            git commit -m "chore: update latest dataset $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo 'No changes'
            git push
          fi
